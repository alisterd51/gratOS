[package]
name = "gratos"
version = "0.4.3"
edition = "2024"
description = "kernel from scratch"
repository = "https://github.com/alisterd51/gratOS"
readme = "README.md"
license = "GPL-3.0"
keywords = ["kernel"]
categories = ["embedded"]

[[bin]]
name = "gratos"
path = "src/main.rs"
test = false
bench = false

[dependencies]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
opt-level = "s"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# from clippy::restriction
absolute_paths = "deny"
alloc_instead_of_core = "deny"
as_pointer_underscore = "deny"
as_underscore = "deny"
decimal_literal_representation = "deny"
definition_in_module_root = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
field_scoped_visibility_modifiers = "deny"
if_then_some_else_none = "deny"
impl_trait_in_params = "deny"
# indexing_slicing = "deny"
infinite_loop = "deny"
inline_asm_x86_att_syntax = "deny"
inline_modules = "deny"
inline_trait_bounds = "deny"
iter_over_hash_type = "deny"
map_err_ignore = "deny"
map_with_unused_argument_over_ranges = "deny"
# min_ident_chars = "deny"
module_name_repetitions = "deny"
multiple_inherent_impl = "deny"
needless_raw_strings = "deny"
partial_pub_fields = "deny"
precedence_bits = "deny"
redundant_type_annotations = "deny"
ref_patterns = "deny"
renamed_function_params = "deny"
return_and_then = "deny"
self_named_module_files = "deny"
semicolon_outside_block = "deny"
separated_literal_suffix = "deny"
string_lit_chars_any = "deny"
str_to_string = "deny"
suspicious_xor_used_as_pow = "deny"
todo = "deny"
# undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unnecessary_rest_pattern = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unnecessary_self_imports = "deny"
unneeded_field_pattern = "deny"
unreachable = "deny"
unused_result_ok = "deny"
unused_trait_names = "deny"
unwrap_used = "deny"

[features]
default = []
multiboot = []
multiboot2 = []
