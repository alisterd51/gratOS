name: Nightly Release

on:
  workflow_dispatch:
  schedule:
    - cron: '42 0 * * *'

jobs:
  nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container: ghcr.io/alisterd51/cross-toolchain:nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build ISO
        run: |
          make iso BUILD=release BOOTPROTOCOL=multiboot2 BOOTLOADER=grub
          make iso BUILD=release BOOTPROTOCOL=multiboot2 BOOTLOADER=limine
      - name: Upload nightly artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gratos-nightly
          path: |
            build/release/gratos.x86.grub.iso
            build/release/gratos.x86.limine.iso
          retention-days: 7
