name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container: ghcr.io/alisterd51/cross-toolchain:nightly
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build ISO
        run: |
          make iso BUILD=release BOOTPROTOCOL=multiboot2 BOOTLOADER=grub
          make iso BUILD=release BOOTPROTOCOL=multiboot2 BOOTLOADER=limine
      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            build/release/gratos.x86.grub.iso
            build/release/gratos.x86.limine.iso
          fail_on_unmatched_files: true
